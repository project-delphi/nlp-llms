  - id: word-vectors
    title: "Word Vectors: Probe Words and Analogies"
    compare: "The same skip-gram embeddings, trained on the arXiv Topics training abstracts and searched over the same 12,469-word vocabulary, against probe lists written before training."
    caution: "A rough check, not a benchmark: an expected list can miss good neighbors, and a hit can be luck."
    rows:
      - lab: 2
        exercise: 2
        model: "Skip-gram with negative sampling, trained in Lab 2"
        dataset: topics
        split: train
        unit: "probe word"
        metric: "neighbor hit rate: share of probe words with an expected word among their 10 nearest neighbors by cosine"
        direction: higher
        baseline: "random vectors: close to 0, since 10 random words out of 12,469 rarely include an expected one"
        seed: 0
      - lab: 2
        model: "Skip-gram with negative sampling, trained in Lab 2"
        dataset: topics
        split: train
        unit: analogy
        metric: "analogy accuracy"
        direction: higher
        baseline: "random vectors: close to 0 (the answer must be one word out of 12,469)"
        seed: 0

