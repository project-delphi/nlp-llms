        dataset: generated
        split: "test, K = 1 (500 sources, seed 0)"
        unit: example
        metric: "exact match"
        direction: higher
        baseline: "the model without attention at K = 1"
        seed: 0
      - lab: 4
        exercise: 3
        model: "Encoder-decoder with dot-product attention"
        dataset: generated
        split: "test, K = 4 (500 sources, seed 0)"
        unit: example
        metric: "exact match"
        direction: higher
        baseline: "the model without attention at K = 4"
        seed: 0
      - lab: 4
        exercise: 4
        model: "Encoder-decoder with additive attention"
        dataset: generated
        split: "test, K = 4 (500 sources, seed 0)"
        unit: example
        metric: "exact match"
        direction: higher
