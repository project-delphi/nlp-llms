# The results worksheet (worksheet.qmd and worksheet.csv), written by scripts/gen_tables.py.
# Participants fill result, path, environment and interpretation; nothing here is a result.
#
# Conventions used below (Academic Director, 2026-10-08):
# - One row per number a lab's core path prints on its results card or in a results table:
#   the numbers the day wrap-ups' running tables ask for. Per-class scores, training
#   curves and timings are left out.
# - `exercise` names the exercise whose section prints the number; it is omitted when the
#   number first appears in a provided Run section or on the results card.
# - `dataset: generated` marks data a notebook builds from a fixed seed (Lab 4's dates,
#   Lab 8's announcements, Lab 9's toy task); there is no key for it under `datasets:`.
#   Labs 13 and 15 name `lectures`, the corpus; `split` names the question set.
# - A number in `baseline` is either a definition (it says so) or a value recorded in
#   data/baselines.json and quoted on the module page named beside it.
groups:
  - id: lm-characters
    title: "Language Modeling: Tiny Shakespeare, per Character"
    compare: "Every row scores the same 60,394 characters of the Tiny Shakespeare test split, over the same 65-character vocabulary of the training split, with the same formula, and every setting was chosen on the validation split."
    caution: "Never add a per-word or per-subword-token number to this group (Lab 1's word models, Lab 6, Lab 7). On a CPU, Labs 3 and 5 run in QUICK mode, a smaller configuration: write QUICK beside such a row and compare it only with other QUICK rows."
    rows:
      - lab: 1
        exercise: 3
        model: "Character bigram with add-k smoothing (k chosen on val)"
        dataset: lm
        split: test
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "uniform over the 65 characters: ln 65 ≈ 4.17 nats per character (definition)"
      - lab: 1
        exercise: 3
        model: "Character trigram with add-k smoothing (k chosen on val)"
        dataset: lm
        split: test
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "the bigram row above; uniform: ln 65 ≈ 4.17 (definition)"
      - lab: 1
        exercise: 3
        model: "Character 5-gram with add-k smoothing (the best order up to 5 on val)"
        dataset: lm
        split: test
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "the bigram and trigram rows above; uniform: ln 65 ≈ 4.17 (definition)"
      - lab: 3
        model: "RNN language model, hand-written cell, hidden size 256"
        dataset: lm
        split: test
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "your Lab 1 5-gram row; recorded reference 1.8326 nats per character, perplexity 6.25 (data/baselines.json, quoted in Module 3, section 6)"
        seed: 0
      - lab: 3
        model: "LSTM language model, nn.LSTM, hidden size 256"
        dataset: lm
        split: test
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "your Lab 1 5-gram row; recorded reference 1.8326 nats per character, perplexity 6.25 (data/baselines.json, quoted in Module 3, section 6)"
        seed: 0
      - lab: 5
        exercise: 4
        model: "Mini-GPT before training"
        dataset: lm
        split: val
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "uniform over the 65 characters: ln 65 = 4.1744 (definition); an untrained model should be close to it"
        seed: 0
      - lab: 5
        exercise: 4
        model: "LSTM of Lab 3's architecture, retrained with the mini-GPT's training loop and budget"
        dataset: lm
        split: test
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "Lab 3's own LSTM run; recorded reference 1.6114 nats per character (data/baselines.json, quoted in Module 5, section 7)"
        seed: 0
      - lab: 5
        exercise: 4
        model: "Mini-GPT: decoder-only transformer, d = 128, 4 heads, 4 blocks, context length 128"
        dataset: lm
        split: test
        unit: character
        metric: "cross-entropy, nats per character"
        direction: lower
        baseline: "the retrained LSTM in the row above, its partner at the same budget; recorded reference 1.5727 nats per character (data/baselines.json, quoted in Module 5, section 7)"
        seed: 0

