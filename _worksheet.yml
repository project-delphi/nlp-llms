  - id: transduction
    title: "Sequence Transduction: Dates to ISO Format"
    compare: "Every model is trained on the same 100,000 generated sources for the same number of steps and scored with greedy decoding on the same generated test set, 500 sources for each number of dates K; an output counts only if the whole string is right."
    caution: "Compare models at the same K, and read K = 1 against K = 4 within one model: the gap is the bottleneck."
    rows:
      - lab: 4
        exercise: 2
        model: "Encoder-decoder without attention (GRU encoder and decoder)"
        dataset: generated
        split: "test, K = 1 (500 sources, seed 0)"
        unit: example
        metric: "exact match"
        direction: higher
        baseline: "the same model at K = 4, in the next row"
        seed: 0
      - lab: 4
        exercise: 2
        model: "Encoder-decoder without attention (GRU encoder and decoder)"
        dataset: generated
        split: "test, K = 4 (500 sources, seed 0)"
