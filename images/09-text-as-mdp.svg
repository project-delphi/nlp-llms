<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img" aria-labelledby="t d">
  <title id="t">Text generation as a sequence of decisions</title>
  <desc id="d">Four state boxes in a row, s_1 to s_4. Each holds the prompt x, in gray, followed by the tokens so far: s_1 holds x, s_2 holds x y_1, s_3 holds x y_1 y_2 and s_4 holds x y_1 y_2 y_3. Between consecutive states an arrow passes through a small box marked LM, the same box at every step: the action a_t = y_t is drawn from pi_theta given s_t. Above the arrows, the rewards r_1 = 0, r_2 = 0 and r_3 = 0. The last arrow, the action a_4 = y_4 = eos, ends in a box marked eos, and its reward, in the accent color, is r_4 = R(x, y). A bracket under the whole strip is labeled: return G = r_1 + r_2 + r_3 + r_4 = R(x, y).</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2933; }
    .m { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
    .s { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .i { font-style: italic; }
    .b { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .note { font-size: 13.5px; fill: #52606d; }
    .acc { fill: #b3541e; }
    .box { fill: #eef2f6; stroke: #16324f; stroke-width: 1.5; }
    .abox { fill: #f8e9de; stroke: #b3541e; stroke-width: 1.5; }
    .dim { fill: #f4f6f9; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #16324f; stroke-width: 1.5; }
    .aln { fill: none; stroke: #b3541e; stroke-width: 2.5; }
    .dln { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rule { fill: none; stroke: #c5ced8; stroke-width: 1.5; }
    .op { fill: #ffffff; stroke: #16324f; stroke-width: 1.5; }
    .panel { fill: #fafbfc; stroke: #c5ced8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16324f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker>
  </defs>
  <rect width="760" height="268" rx="8" fill="#ffffff"/>
  <text x="24" y="32" text-anchor="start" class="m" style="font-size:15px"><tspan class="s">Each step: </tspan><tspan class="i">a</tspan><tspan dy="3.6" font-size="10.2" class="i">t</tspan><tspan dy="-3.6"> = </tspan><tspan class="i">y</tspan><tspan dy="3.6" font-size="10.2" class="i">t</tspan><tspan dy="-3.6"> ∼ </tspan><tspan class="i">π</tspan><tspan dy="3.6" font-size="10.2" class="i">θ</tspan><tspan dy="-3.6">(· | </tspan><tspan class="i">s</tspan><tspan dy="3.6" font-size="10.2" class="i">t</tspan><tspan dy="-3.6">)</tspan><tspan class="s">, drawn from the same LM box: one policy, shared by every step</tspan></text>
  <rect class="box" x="19" y="98" width="44" height="44" rx="6"/>
  <text x="41" y="86" text-anchor="middle" class="m" style="font-size:17px"><tspan class="i">s</tspan><tspan dy="4.1" font-size="11.6">1</tspan></text>
  <text x="35.5" y="126" text-anchor="start" class="m note" style="font-size:19px"><tspan class="i">x</tspan></text>
  <line class="ln" x1="63" y1="120" x2="78" y2="120" marker-end="url(#a)"/>
  <rect class="op" x="79" y="106" width="42" height="28" rx="5"/>
  <text x="100" y="125" text-anchor="middle" class="mono" style="font-size:13px">LM</text>
  <line class="ln" x1="121" y1="120" x2="140" y2="120" marker-end="url(#a)"/>
  <text x="100" y="94" text-anchor="middle" class="m note" style="font-size:15px"><tspan class="i">r</tspan><tspan dy="3.6" font-size="10.2">1</tspan><tspan dy="-3.6"> = 0</tspan></text>
  <text x="100" y="158" text-anchor="middle" class="m" style="font-size:15px"><tspan class="i">a</tspan><tspan dy="3.6" font-size="10.2">1</tspan><tspan dy="-3.6"> = </tspan><tspan class="i">y</tspan><tspan dy="3.6" font-size="10.2">1</tspan></text>
  <rect class="box" x="141" y="98" width="72" height="44" rx="6"/>
  <text x="177" y="86" text-anchor="middle" class="m" style="font-size:17px"><tspan class="i">s</tspan><tspan dy="4.1" font-size="11.6">2</tspan></text>
  <text x="157.5" y="126" text-anchor="start" class="m note" style="font-size:19px"><tspan class="i">x</tspan></text>
  <text x="174.5" y="126" text-anchor="start" class="m" style="font-size:19px"><tspan class="i">y</tspan><tspan dy="4.6" font-size="12.9">1</tspan></text>
  <line class="ln" x1="213" y1="120" x2="228" y2="120" marker-end="url(#a)"/>
  <rect class="op" x="229" y="106" width="42" height="28" rx="5"/>
  <text x="250" y="125" text-anchor="middle" class="mono" style="font-size:13px">LM</text>
  <line class="ln" x1="271" y1="120" x2="290" y2="120" marker-end="url(#a)"/>
  <text x="250" y="94" text-anchor="middle" class="m note" style="font-size:15px"><tspan class="i">r</tspan><tspan dy="3.6" font-size="10.2">2</tspan><tspan dy="-3.6"> = 0</tspan></text>
  <text x="250" y="158" text-anchor="middle" class="m" style="font-size:15px"><tspan class="i">a</tspan><tspan dy="3.6" font-size="10.2">2</tspan><tspan dy="-3.6"> = </tspan><tspan class="i">y</tspan><tspan dy="3.6" font-size="10.2">2</tspan></text>
  <rect class="box" x="291" y="98" width="100" height="44" rx="6"/>
  <text x="341" y="86" text-anchor="middle" class="m" style="font-size:17px"><tspan class="i">s</tspan><tspan dy="4.1" font-size="11.6">3</tspan></text>
  <text x="307.5" y="126" text-anchor="start" class="m note" style="font-size:19px"><tspan class="i">x</tspan></text>
  <text x="324.5" y="126" text-anchor="start" class="m" style="font-size:19px"><tspan class="i">y</tspan><tspan dy="4.6" font-size="12.9">1</tspan><tspan dy="-4.6"> </tspan><tspan class="i">y</tspan><tspan dy="4.6" font-size="12.9">2</tspan></text>
  <line class="ln" x1="391" y1="120" x2="406" y2="120" marker-end="url(#a)"/>
  <rect class="op" x="407" y="106" width="42" height="28" rx="5"/>
  <text x="428" y="125" text-anchor="middle" class="mono" style="font-size:13px">LM</text>
  <line class="ln" x1="449" y1="120" x2="468" y2="120" marker-end="url(#a)"/>
  <text x="428" y="94" text-anchor="middle" class="m note" style="font-size:15px"><tspan class="i">r</tspan><tspan dy="3.6" font-size="10.2">3</tspan><tspan dy="-3.6"> = 0</tspan></text>
  <text x="428" y="158" text-anchor="middle" class="m" style="font-size:15px"><tspan class="i">a</tspan><tspan dy="3.6" font-size="10.2">3</tspan><tspan dy="-3.6"> = </tspan><tspan class="i">y</tspan><tspan dy="3.6" font-size="10.2">3</tspan></text>
  <rect class="box" x="469" y="98" width="128" height="44" rx="6"/>
  <text x="533" y="86" text-anchor="middle" class="m" style="font-size:17px"><tspan class="i">s</tspan><tspan dy="4.1" font-size="11.6">4</tspan></text>
  <text x="485.5" y="126" text-anchor="start" class="m note" style="font-size:19px"><tspan class="i">x</tspan></text>
  <text x="502.5" y="126" text-anchor="start" class="m" style="font-size:19px"><tspan class="i">y</tspan><tspan dy="4.6" font-size="12.9">1</tspan><tspan dy="-4.6"> </tspan><tspan class="i">y</tspan><tspan dy="4.6" font-size="12.9">2</tspan><tspan dy="-4.6"> </tspan><tspan class="i">y</tspan><tspan dy="4.6" font-size="12.9">3</tspan></text>
  <line class="ln" x1="597" y1="120" x2="612" y2="120" marker-end="url(#a)"/>
  <rect class="op" x="613" y="106" width="42" height="28" rx="5"/>
  <text x="634" y="125" text-anchor="middle" class="mono" style="font-size:13px">LM</text>
  <line class="ln" x1="655" y1="120" x2="674" y2="120" marker-end="url(#a)"/>
  <text x="634" y="94" text-anchor="middle" class="m acc" style="font-size:15px"><tspan class="i">r</tspan><tspan dy="3.6" font-size="10.2">4</tspan><tspan dy="-3.6"> = </tspan><tspan class="i">R</tspan><tspan>(</tspan><tspan class="i">x</tspan><tspan>, </tspan><tspan class="i">y</tspan><tspan>)</tspan></text>
  <text x="628" y="158" text-anchor="end" class="m" style="font-size:15px"><tspan class="i">a</tspan><tspan dy="3.6" font-size="10.2">4</tspan><tspan dy="-3.6"> = </tspan><tspan class="i">y</tspan><tspan dy="3.6" font-size="10.2">4</tspan><tspan dy="-3.6"> =</tspan></text>
  <text x="632" y="158" text-anchor="start" class="mono" style="font-size:13px">&lt;eos&gt;</text>
  <rect class="abox" x="675" y="98" width="66" height="44" rx="6"/>
  <text x="708" y="125" text-anchor="middle" class="mono" style="font-size:14px">&lt;eos&gt;</text>
  <text x="708" y="86" text-anchor="middle" class="note">end</text>
  <path class="rule" d="M19,175 v7 H741 v-7"/>
  <text x="380" y="208" text-anchor="middle" class="m" style="font-size:17px"><tspan class="s">return </tspan><tspan class="i">G</tspan><tspan> = </tspan><tspan class="i">r</tspan><tspan dy="4.1" font-size="11.6">1</tspan><tspan dy="-4.1"> + </tspan><tspan class="i">r</tspan><tspan dy="4.1" font-size="11.6">2</tspan><tspan dy="-4.1"> + </tspan><tspan class="i">r</tspan><tspan dy="4.1" font-size="11.6">3</tspan><tspan dy="-4.1"> + </tspan><tspan class="i">r</tspan><tspan dy="4.1" font-size="11.6">4</tspan><tspan dy="-4.1"> = </tspan><tspan class="i">R</tspan><tspan>(</tspan><tspan class="i">x</tspan><tspan>, </tspan><tspan class="i">y</tspan><tspan>)</tspan></text>
  <text x="380" y="232" text-anchor="middle" class="note">the reward arrives once, at the end: every earlier step gets reward 0</text>
</svg>
