  <line x1="477.9" y1="580" x2="477.9" y2="594" stroke="#1f2933" stroke-width="1.6"/>
  <text x="477.9" y="609" text-anchor="middle" class="m" style="font-size:13.5px"><tspan class="i">τ</tspan><tspan dy="3.2" font-size="9.2">act</tspan></text>
  <rect class="tagbox" x="456" y="487" width="45" height="18" rx="9"/>
