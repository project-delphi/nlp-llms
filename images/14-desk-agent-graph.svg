  <text x="392" y="204" text-anchor="end" class="m note" style="font-size:14px"><tspan class="i">p̂</tspan><tspan dy="3.4" font-size="9.5">route</tspan><tspan dy="-3.4"> ≥ </tspan><tspan class="i">τ</tspan><tspan dy="3.4" font-size="9.5">route</tspan><tspan dy="-3.4" class="s">, and the route is</tspan></text>
