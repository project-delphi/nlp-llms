  <path class="cln" d="M505,76 H840 V553 H787" marker-end="url(#a)"/>
  <text x="744" y="68" text-anchor="end" class="m note" style="font-size:14px"><tspan class="i">p̂</tspan><tspan dy="3.4" font-size="9.5">route</tspan><tspan dy="-3.4"> &lt; </tspan><tspan class="i">τ</tspan><tspan dy="3.4" font-size="9.5">route</tspan><tspan dy="-3.4" class="s">, or the route is</tspan></text>
  <text x="748" y="68" text-anchor="start" class="note sm mono">escalate</text>
  <rect class="abox" x="300" y="248" width="200" height="60" rx="8"/>
  <text x="400" y="275" text-anchor="middle" class="b mono" style="font-size:15px">agent</text>
  <text x="400" y="293" text-anchor="middle" class="note sm">language model with tools</text>
