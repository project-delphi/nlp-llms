<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 566" width="780" height="566" role="img" aria-labelledby="t d">
  <title id="t">Reliability diagrams of the Lab 1 classifier before and after temperature scaling (measured)</title>
  <desc id="d">Two reliability diagrams side by side, confidence (mean per bin) against accuracy (mean per bin), both from 0 to 1, with a dashed diagonal labeled perfect calibration. Each non-empty bin of 15 is a dot whose area grows with its count, joined to the diagonal by a shaded bar. Left, the Lab 1 classifier with C = 1, ECE 0.164: the dots lie well above the diagonal, the model is right more often than its confidence says (underconfident); its confidences spread from about 0.3 to 1. Right, the same model after temperature scaling with tau = 0.47, ECE 0.009: the dots lie on the diagonal, and most confidences have moved up, 962 of the 1600 into the top bin. Under each diagram, a histogram of the 1600 test confidences.</desc>
