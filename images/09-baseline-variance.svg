<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d">
  <title id="t">REINFORCE estimates with and without a baseline (measured in Lab 9)</title>
  <desc id="d">Two histograms on the same horizontal axis, one above the other, of 500 one-batch REINFORCE estimates (batches of 16) of one coordinate of the gradient at the uniform policy: the logit of the target's first symbol at step 1. Top, in gray: no baseline, standard deviation 0.023. Bottom, in the accent color: the leave-one-out baseline, standard deviation 0.014. A dashed vertical line across both marks the exact gradient, 0.0182. Both histograms are centered near it; the bottom one is visibly narrower. The estimates are measured: Lab 9 writes them in Exercise 2.</desc>
