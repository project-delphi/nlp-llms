  <line class="ln" x1="562" y1="86" x2="562" y2="108" marker-end="url(#a)"/>
  <rect class="op" x="604" y="56" width="56" height="30" rx="5"/>
  <text x="632" y="76" text-anchor="middle" class="mono" style="font-size:13px">[SEP]</text>
  <line class="ln" x1="632" y1="86" x2="632" y2="108" marker-end="url(#a)"/>
  <rect class="op" x="666" y="56" width="112" height="30" rx="5"/>
