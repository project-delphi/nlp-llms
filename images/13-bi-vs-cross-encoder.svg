  <line class="ln" x1="722" y1="86" x2="722" y2="108" marker-end="url(#a)"/>
  <rect class="box" x="452" y="110" width="324" height="52" rx="6"/>
  <text x="614" y="132" text-anchor="middle" class="b" style="font-size:14.5px">encoder</text>
  <text x="614" y="151" text-anchor="middle" class="m note" style="font-size:13.5px"><tspan class="s">every layer attends across </tspan><tspan class="i">q</tspan><tspan class="s"> and </tspan><tspan class="i">c</tspan></text>
  <line class="ln" x1="492" y1="162" x2="492" y2="184" marker-end="url(#a)"/>
  <rect x="460" y="186" width="13" height="15" fill="#f8e9de" stroke="#b3541e" stroke-width="1.1"/>
  <rect x="473" y="186" width="13" height="15" fill="#f8e9de" stroke="#b3541e" stroke-width="1.1"/>
  <rect x="486" y="186" width="13" height="15" fill="#f8e9de" stroke="#b3541e" stroke-width="1.1"/>
  <rect x="499" y="186" width="13" height="15" fill="#f8e9de" stroke="#b3541e" stroke-width="1.1"/>
  <rect x="512" y="186" width="13" height="15" fill="#f8e9de" stroke="#b3541e" stroke-width="1.1"/>
  <line class="dln" x1="562" y1="162" x2="562" y2="176"/>
