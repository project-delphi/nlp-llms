  <rect x="322" y="182" width="13" height="15" fill="#ffffff" stroke="#16324f" stroke-width="1.1"/>
  <text x="68" y="195" text-anchor="end" class="m" style="font-size:15px"><tspan class="i">h</tspan><tspan dy="3.6" font-size="10.2" class="i">q</tspan></text>
  <text x="344" y="195" text-anchor="start" class="m" style="font-size:15px"><tspan class="i">h</tspan><tspan dy="3.6" font-size="10.2" class="i">c</tspan></text>
  <line class="ln" x1="110" y1="197" x2="196" y2="252" marker-end="url(#a)"/>
  <line class="ln" x1="302" y1="197" x2="216" y2="252" marker-end="url(#a)"/>
  <circle class="op" cx="206" cy="262" r="13"/>
  <circle cx="206" cy="262" r="3.2" fill="#16324f"/>
  <text x="184" y="267" text-anchor="end" class="note sm">dot product</text>
  <line class="ln" x1="206" y1="275" x2="206" y2="298" marker-end="url(#a)"/>
  <text x="206" y="318" text-anchor="middle" class="m" style="font-size:16px"><tspan class="i">s</tspan><tspan dy="3.8" font-size="10.9">dense</tspan><tspan dy="-3.8"> = </tspan><tspan class="i">h</tspan><tspan dy="3.8" font-size="10.9" class="i">q</tspan><tspan dy="-9.6" font-size="10.9">⊤</tspan><tspan dy="5.8"> </tspan><tspan class="i">h</tspan><tspan dy="3.8" font-size="10.9" class="i">c</tspan></text>
  <text x="290" y="226" text-anchor="start" class="note sm">chunk vectors</text>
  <text x="290" y="242" text-anchor="start" class="note sm">computed once,</text>
  <text x="290" y="258" text-anchor="start" class="note sm">offline</text>
  <text x="206" y="350" text-anchor="middle" class="note sm">one encoder pass per query</text>
  <rect class="panel" x="418" y="10" width="392" height="352" rx="12"/>
  <text x="434" y="36" text-anchor="start" class="b" style="font-size:15px">cross-encoder (rerank)</text>
  <rect class="tagbox" x="755" y="21" width="45" height="18" rx="9"/>
  <text x="777.5" y="34.2" text-anchor="middle" class="tag">Ex. 4</text>
  <rect class="op" x="464" y="56" width="56" height="30" rx="5"/>
  <text x="492" y="76" text-anchor="middle" class="mono" style="font-size:13px">[CLS]</text>
  <line class="ln" x1="492" y1="86" x2="492" y2="108" marker-end="url(#a)"/>
