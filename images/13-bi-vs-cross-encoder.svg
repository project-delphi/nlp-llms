  <line class="dln" x1="722" y1="162" x2="722" y2="176"/>
  <text x="556" y="199" text-anchor="start" class="note sm">other outputs unused</text>
  <text x="452" y="199" text-anchor="end" class="m note" style="font-size:12.5px"><tspan class="s">CLS</tspan></text>
  <line class="ln" x1="492" y1="201" x2="492" y2="232" marker-end="url(#a)"/>
  <rect class="op" x="470" y="234" width="44" height="28" rx="5"/>
  <text x="492" y="253" text-anchor="middle" class="m" style="font-size:15px"><tspan class="i">w</tspan></text>
  <text x="524" y="253" text-anchor="start" class="note sm">linear head</text>
  <line class="ln" x1="492" y1="262" x2="492" y2="298" marker-end="url(#a)"/>
  <text x="478" y="318" text-anchor="start" class="m" style="font-size:16px"><tspan class="i">s</tspan><tspan dy="3.8" font-size="10.9">cross</tspan><tspan dy="-3.8"> = </tspan><tspan class="i">w</tspan><tspan dy="-5.8" font-size="10.9">⊤</tspan><tspan dy="5.8"> Enc([</tspan><tspan class="s">CLS</tspan><tspan>] </tspan><tspan class="i">q</tspan><tspan> [</tspan><tspan class="s">SEP</tspan><tspan>] </tspan><tspan class="i">c</tspan><tspan>)</tspan><tspan dy="3.8" font-size="10.9" class="s">CLS</tspan></text>
  <text x="614" y="350" text-anchor="middle" class="note sm">one pass per (query, chunk) pair</text>
</svg>
