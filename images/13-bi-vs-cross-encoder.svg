  <rect x="283" y="182" width="13" height="15" fill="#ffffff" stroke="#16324f" stroke-width="1.1"/>
  <rect x="296" y="182" width="13" height="15" fill="#ffffff" stroke="#16324f" stroke-width="1.1"/>
