<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" role="img" aria-labelledby="t d">
  <title id="t">The RAG pipeline</title>
  <desc id="d">Two horizontal lanes. Top lane, once, offline (indexing): load (documents), chunk (chunks c_1 to c_M), embed (vectors h_c) and index (vector store and BM25 index); chunk, embed and index are tagged Ex. 2, build_index. Bottom lane, per query: the question q goes to retrieve (top k_0 candidates), which reads the index through an arrow up into it; then rerank (keep the top k), generate (an LLM with numbered sources) and the answer with citations. Retrieve is tagged Ex. 2 and 3, rerank Ex. 4, generate Ex. 5. Under retrieve and rerank: measured by recall@k and MRR (section 8; Ex. 1). Under generate and the answer: measured by faithfulness, relevance and correctness (section 9). Retrieval stages are blue, generation is orange.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2933; }
    .m { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
    .s { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .i { font-style: italic; }
    .b { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .note { font-size: 13.5px; fill: #52606d; }
    .acc { fill: #b3541e; }
    .box { fill: #eef2f6; stroke: #16324f; stroke-width: 1.5; }
    .abox { fill: #f8e9de; stroke: #b3541e; stroke-width: 1.5; }
    .dim { fill: #f4f6f9; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #16324f; stroke-width: 1.5; }
    .aln { fill: none; stroke: #b3541e; stroke-width: 2.5; }
    .dln { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rule { fill: none; stroke: #c5ced8; stroke-width: 1.5; }
    .op { fill: #ffffff; stroke: #16324f; stroke-width: 1.5; }
    .panel { fill: #fafbfc; stroke: #c5ced8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16324f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker>
    <style>
    .dbox { fill: #ece6f5; stroke: #6a4c9c; stroke-width: 1.5; }
    .cln { fill: none; stroke: #16324f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .dotted { fill: none; stroke: #52606d; stroke-width: 1.6; stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
    .bound { fill: none; stroke: #52606d; stroke-width: 1.4; stroke-dasharray: 2 4; stroke-linecap: round; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .pill { fill: #16324f; }
    .pilltext { fill: #ffffff; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; }
    .tagbox { fill: #ffffff; stroke: #52606d; stroke-width: 1; }
    .tag { font-size: 12px; font-weight: 600; fill: #52606d; }
    .sm { font-size: 13px; }
    .m { font-variant-numeric: lining-nums; }
  </style>
  </defs>
  <rect width="860" height="370" rx="8" fill="#ffffff"/>
  <rect class="panel" x="10" y="30" width="840" height="116" rx="12"/>
  <text x="26" y="52" text-anchor="start" class="note b">once, offline (indexing)</text>
  <rect class="panel" x="10" y="192" width="840" height="116" rx="12"/>
  <text x="26" y="214" text-anchor="start" class="note b">per query</text>
  <rect class="box" x="26" y="70" width="140" height="58" rx="8"/>
  <text x="96" y="96" text-anchor="middle" class="b" style="font-size:15px">load</text>
  <text x="96" y="114" text-anchor="middle" class="note sm">documents</text>
  <rect class="box" x="214" y="70" width="140" height="58" rx="8"/>
  <text x="284" y="96" text-anchor="middle" class="b" style="font-size:15px">chunk</text>
  <text x="284" y="114" text-anchor="middle" class="m note" style="font-size:14px"><tspan class="s">chunks </tspan><tspan class="i">c</tspan><tspan dy="3.4" font-size="9.5" class="s">1</tspan><tspan dy="-3.4"> … </tspan><tspan class="i">c</tspan><tspan dy="3.4" font-size="9.5" class="i">M</tspan></text>
  <rect class="box" x="402" y="70" width="140" height="58" rx="8"/>
  <text x="472" y="96" text-anchor="middle" class="b" style="font-size:15px">embed</text>
  <text x="472" y="114" text-anchor="middle" class="m note" style="font-size:14px"><tspan class="s">vectors </tspan><tspan class="i">h</tspan><tspan dy="3.4" font-size="9.5" class="i">c</tspan></text>
  <rect class="box" x="590" y="70" width="240" height="58" rx="8"/>
  <text x="710" y="96" text-anchor="middle" class="b" style="font-size:15px">index</text>
  <text x="710" y="114" text-anchor="middle" class="note sm">vector store + BM25 index</text>
  <line class="ln" x1="166" y1="99" x2="212" y2="99" marker-end="url(#a)"/>
  <line class="ln" x1="354" y1="99" x2="400" y2="99" marker-end="url(#a)"/>
  <line class="ln" x1="542" y1="99" x2="588" y2="99" marker-end="url(#a)"/>
  <path class="rule" d="M214,62 V57 H830 V62"/>
  <rect class="tagbox" x="699.2" y="48" width="130.8" height="18" rx="9"/>
  <text x="764.6" y="61.2" text-anchor="middle" class="tag">Ex. 2: build_index</text>
  <rect class="op" x="26" y="238" width="92" height="46" rx="23"/>
  <text x="72" y="267" text-anchor="middle" class="m" style="font-size:14px"><tspan class="s">question </tspan><tspan class="i">q</tspan></text>
  <rect class="box" x="156" y="232" width="150" height="58" rx="8"/>
  <text x="231" y="258" text-anchor="middle" class="b" style="font-size:15px">retrieve</text>
  <text x="231" y="276" text-anchor="middle" class="m note" style="font-size:14px"><tspan class="s">top </tspan><tspan class="i">k</tspan><tspan dy="3.4" font-size="9.5" class="s">0</tspan><tspan dy="-3.4" class="s"> candidates</tspan></text>
  <rect class="tagbox" x="237.2" y="223" width="64.8" height="18" rx="9"/>
  <text x="269.6" y="236.2" text-anchor="middle" class="tag">Ex. 2, 3</text>
  <rect class="box" x="344" y="232" width="150" height="58" rx="8"/>
  <text x="419" y="258" text-anchor="middle" class="b" style="font-size:15px">rerank</text>
  <text x="419" y="276" text-anchor="middle" class="m note" style="font-size:14px"><tspan class="s">keep the top </tspan><tspan class="i">k</tspan></text>
  <rect class="tagbox" x="445" y="223" width="45" height="18" rx="9"/>
  <text x="467.5" y="236.2" text-anchor="middle" class="tag">Ex. 4</text>
  <rect class="abox" x="532" y="232" width="150" height="58" rx="8"/>
  <text x="607" y="258" text-anchor="middle" class="b" style="font-size:15px">generate</text>
  <text x="607" y="276" text-anchor="middle" class="note sm">LLM, numbered sources</text>
  <rect class="tagbox" x="633" y="223" width="45" height="18" rx="9"/>
  <text x="655.5" y="236.2" text-anchor="middle" class="tag">Ex. 5</text>
  <rect class="op" x="720" y="232" width="112" height="58" rx="8"/>
  <text x="776" y="258" text-anchor="middle" class="b" style="font-size:15px">answer</text>
  <text x="776" y="276" text-anchor="middle" class="note sm">with citations</text>
  <line class="ln" x1="118" y1="261" x2="154" y2="261" marker-end="url(#a)"/>
  <line class="ln" x1="306" y1="261" x2="342" y2="261" marker-end="url(#a)"/>
  <line class="ln" x1="494" y1="261" x2="530" y2="261" marker-end="url(#a)"/>
  <line class="ln" x1="682" y1="261" x2="718" y2="261" marker-end="url(#a)"/>
  <path class="ln" d="M190,232 V170 H710 V130" marker-end="url(#a)"/>
  <text x="450" y="164" text-anchor="middle" class="m note" style="font-size:14px"><tspan class="s">score every chunk against </tspan><tspan class="i">q</tspan><tspan class="s">, from the index</tspan></text>
  <path class="rule" d="M156,318 V323 H494 V318"/>
  <text x="325" y="340" text-anchor="middle" class="note sm">measured by recall@k, MRR (section 8; Ex. 1)</text>
  <path class="rule" d="M532,318 V323 H832 V318"/>
  <text x="682" y="340" text-anchor="middle" class="note sm">measured by faithfulness, relevance,</text>
  <text x="682" y="356" text-anchor="middle" class="note sm">correctness (section 9)</text>
</svg>
