<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-labelledby="t d">
  <title id="t">Reward over-optimization (schematic)</title>
  <desc id="d">A schematic plot with no numbers on the axes. The horizontal axis is the drift from the reference policy, KL in nats per response, starting at 0; the vertical axis is reward. Two curves start at the origin. The reward-model score, the proxy, rises steadily and flattens slowly. The gold reward rises with it at first, peaks, and then falls while the proxy keeps rising. A dashed vertical line at the gold peak is labeled over-optimization starts here. Two markers on the horizontal axis: large beta stops here, left of the peak, and beta = 0 ends here, far to the right, where the gold reward has fallen.</desc>
