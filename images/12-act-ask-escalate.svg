<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-labelledby="t d">
  <title id="t">Act, ask or escalate: expected cost against the probability</title>
  <desc id="d">A computed plot, not a measurement. The horizontal axis is p-hat, the probability that the answer is right, from 0 to 1; the vertical axis is the expected cost per case, from 0 to 20. Three straight lines use the worked example's costs (l_wrong 20, l_ask 0.5, l_miss 4, l_esc 3): act, (1 - p-hat) times 20, falls from 20 to 0; ask, 0.5 + (1 - p-hat) times 4, falls from 4.5 to 0.5; escalate is flat at 3. The lowest line at each p-hat is shaded: escalate below tau_esc = 0.375, ask between 0.375 and tau_act = 0.969, act above 0.969. Dashed vertical lines mark the two thresholds. A dotted line at Chow's lambda* = 0.85, where act and escalate cross, is labeled two-action rule; there the ask line is lower than both.</desc>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2933; }
    .m { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
    .s { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .i { font-style: italic; }
    .b { font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .note { font-size: 13.5px; fill: #52606d; }
    .acc { fill: #b3541e; }
    .box { fill: #eef2f6; stroke: #16324f; stroke-width: 1.5; }
    .abox { fill: #f8e9de; stroke: #b3541e; stroke-width: 1.5; }
    .dim { fill: #f4f6f9; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .ln { fill: none; stroke: #16324f; stroke-width: 1.5; }
    .aln { fill: none; stroke: #b3541e; stroke-width: 2.5; }
    .dln { fill: none; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rule { fill: none; stroke: #c5ced8; stroke-width: 1.5; }
    .op { fill: #ffffff; stroke: #16324f; stroke-width: 1.5; }
    .panel { fill: #fafbfc; stroke: #c5ced8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16324f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker>
    <style>
    .dbox { fill: #ece6f5; stroke: #6a4c9c; stroke-width: 1.5; }
    .cln { fill: none; stroke: #16324f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .dotted { fill: none; stroke: #52606d; stroke-width: 1.6; stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
    .bound { fill: none; stroke: #52606d; stroke-width: 1.4; stroke-dasharray: 2 4; stroke-linecap: round; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .pill { fill: #16324f; }
    .pilltext { fill: #ffffff; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; }
    .tagbox { fill: #ffffff; stroke: #52606d; stroke-width: 1; }
    .tag { font-size: 12px; font-weight: 600; fill: #52606d; }
    .sm { font-size: 13px; }
    .m { font-variant-numeric: lining-nums; }
  </style>
  </defs>
  <rect width="760" height="424" rx="8" fill="#ffffff"/>
  <rect x="78" y="60" width="243.8" height="300" fill="#eef1f4"/>
  <rect x="321.8" y="60" width="385.9" height="300" fill="#fcf2ea"/>
  <rect x="707.7" y="60" width="20.3" height="300" fill="#e6edf5"/>
  <line class="rule" x1="78" y1="285" x2="728" y2="285" style="stroke-width:1"/>
  <line class="rule" x1="78" y1="210" x2="728" y2="210" style="stroke-width:1"/>
  <line class="rule" x1="78" y1="135" x2="728" y2="135" style="stroke-width:1"/>
  <line class="rule" x1="78" y1="60" x2="728" y2="60" style="stroke-width:1"/>
  <polygon points="78,360 78,315 321.8,315 321.8,360" fill="#d3dae2"/>
  <polygon points="321.8,360 321.8,315 707.7,350.6 707.7,360" fill="#f1d3bd"/>
  <polygon points="707.7,360 707.7,350.6 728,360 728,360" fill="#c2d1e3"/>
  <text x="199.9" y="51" text-anchor="middle" class="b" style="font-size:14.5px">escalate</text>
  <text x="514.7" y="51" text-anchor="middle" class="b" style="font-size:14.5px">ask</text>
  <text x="717.8" y="51" text-anchor="middle" class="b" style="font-size:14.5px">act</text>
  <line class="ln" x1="321.8" y1="60" x2="321.8" y2="360" style="stroke:#1f2933;stroke-dasharray:5 4"/>
  <line class="ln" x1="707.7" y1="60" x2="707.7" y2="360" style="stroke:#1f2933;stroke-dasharray:5 4"/>
  <text x="328.8" y="84" text-anchor="start" class="m" style="font-size:15px"><tspan class="i">τ</tspan><tspan dy="3.6" font-size="10.2">esc</tspan><tspan dy="-3.6"> = </tspan><tspan class="s">0.375</tspan></text>
  <text x="700.7" y="84" text-anchor="end" class="m" style="font-size:15px"><tspan class="i">τ</tspan><tspan dy="3.6" font-size="10.2">act</tspan><tspan dy="-3.6"> = </tspan><tspan class="s">0.969</tspan></text>
  <line class="dotted" x1="630.5" y1="104" x2="630.5" y2="360"/>
  <text x="623.5" y="120" text-anchor="end" class="note sm">two-action rule</text>
  <text x="623.5" y="137" text-anchor="end" class="m note" style="font-size:14px"><tspan class="s">Chow's </tspan><tspan class="i">λ</tspan><tspan dy="-5.0" font-size="9.5">*</tspan><tspan dy="5.0"> = </tspan><tspan class="s">0.85</tspan></text>
  <line class="ln" x1="78" y1="60" x2="728" y2="360" style="stroke:#16324f;stroke-width:2.2"/>
  <line class="ln" x1="78" y1="292.5" x2="728" y2="352.5" style="stroke:#b3541e;stroke-width:2.2;stroke-dasharray:8 4"/>
  <line class="ln" x1="78" y1="315" x2="728" y2="315" style="stroke:#52606d;stroke-width:2.2;stroke-dasharray:2 3"/>
  <text x="92" y="170" text-anchor="start" class="m halo" style="font-size:15px"><tspan class="s">act: </tspan><tspan>(1 − </tspan><tspan class="i">p̂</tspan><tspan>) </tspan><tspan class="i">ℓ</tspan><tspan dy="3.6" font-size="10.2">wrong</tspan></text>
  <text x="92" y="279" text-anchor="start" class="m halo" style="font-size:15px"><tspan class="s">ask: </tspan><tspan class="i">ℓ</tspan><tspan dy="3.6" font-size="10.2">ask</tspan><tspan dy="-3.6"> + (1 − </tspan><tspan class="i">p̂</tspan><tspan>) </tspan><tspan class="i">ℓ</tspan><tspan dy="3.6" font-size="10.2">miss</tspan></text>
  <text x="357.5" y="307" text-anchor="start" class="m halo" style="font-size:15px"><tspan class="s">escalate: </tspan><tspan class="i">ℓ</tspan><tspan dy="3.6" font-size="10.2">esc</tspan></text>
  <circle cx="321.8" cy="315" r="4.2" fill="#1f2933"/>
  <circle cx="707.7" cy="350.6" r="4.2" fill="#1f2933"/>
  <circle cx="630.5" cy="315" r="4" fill="#ffffff" stroke="#52606d" stroke-width="1.6"/>
  <line class="ln" x1="78" y1="360" x2="728" y2="360" style="stroke:#52606d"/>
  <line class="ln" x1="78" y1="360" x2="78" y2="60" style="stroke:#52606d"/>
  <line class="ln" x1="78" y1="360" x2="78" y2="365" style="stroke:#52606d"/>
  <text x="78" y="381" text-anchor="middle" class="note sm">0.0</text>
  <line class="ln" x1="208" y1="360" x2="208" y2="365" style="stroke:#52606d"/>
  <text x="208" y="381" text-anchor="middle" class="note sm">0.2</text>
  <line class="ln" x1="338" y1="360" x2="338" y2="365" style="stroke:#52606d"/>
  <text x="338" y="381" text-anchor="middle" class="note sm">0.4</text>
  <line class="ln" x1="468" y1="360" x2="468" y2="365" style="stroke:#52606d"/>
  <text x="468" y="381" text-anchor="middle" class="note sm">0.6</text>
  <line class="ln" x1="598" y1="360" x2="598" y2="365" style="stroke:#52606d"/>
  <text x="598" y="381" text-anchor="middle" class="note sm">0.8</text>
  <line class="ln" x1="728" y1="360" x2="728" y2="365" style="stroke:#52606d"/>
  <text x="728" y="381" text-anchor="middle" class="note sm">1.0</text>
  <text x="69" y="364.5" text-anchor="end" class="note sm">0</text>
  <text x="69" y="289.5" text-anchor="end" class="note sm">5</text>
  <text x="69" y="214.5" text-anchor="end" class="note sm">10</text>
  <text x="69" y="139.5" text-anchor="end" class="note sm">15</text>
  <text x="69" y="64.5" text-anchor="end" class="note sm">20</text>
  <text x="403" y="410" text-anchor="middle" class="m" style="font-size:15px"><tspan class="s">probability that the answer is right, </tspan><tspan class="i">p̂</tspan></text>
  <text x="24" y="210" text-anchor="middle" class="sm" transform="rotate(-90 24 210)">expected cost per case</text>
  <text x="728" y="24" text-anchor="end" class="m note" style="font-size:14px"><tspan class="s">costs of the worked example: </tspan><tspan class="i">ℓ</tspan><tspan dy="3.4" font-size="9.5">wrong</tspan><tspan dy="-3.4"> = </tspan><tspan class="s">20, </tspan><tspan class="i">ℓ</tspan><tspan dy="3.4" font-size="9.5">ask</tspan><tspan dy="-3.4"> = </tspan><tspan class="s">0.5, </tspan><tspan class="i">ℓ</tspan><tspan dy="3.4" font-size="9.5">miss</tspan><tspan dy="-3.4"> = </tspan><tspan class="s">4, </tspan><tspan class="i">ℓ</tspan><tspan dy="3.4" font-size="9.5">esc</tspan><tspan dy="-3.4"> = </tspan><tspan class="s">3</tspan></text>
</svg>
