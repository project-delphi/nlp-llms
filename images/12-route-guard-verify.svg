<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 446" width="860" height="446" role="img" aria-labelledby="t d">
  <title id="t">Where a decision model fits: route, guard, verify</title>
  <desc id="d">A left-to-right system diagram. A user request enters the router, a decision model that answers a Choice question, what should happen next. Its five next steps fan out: retrieve, calculate, the guard in front of send_email, ask_user and escalate to a person. Retrieve and calculate feed an LLM answer, a generative model, which is followed by verify, a decision model that answers a Noul question: is the answer supported by the sources? If p-hat is at least tau_act, the answer is delivered. The guard, a decision model with a Noul question, may this action run, stands before the risky send_email tool, which runs if p-hat is at least tau_act. Each decision-model box carries a gauge for its probability p-hat with two threshold ticks, tau_esc and tau_act. Tags note where the labs build each one: the router and the guard in Lab 14, Exercise 2, the verifier in Lab 15, Exercise 1. A note says that between tau_esc and tau_act the system asks a person, and below tau_esc it escalates; only the act exits of guard and verify are drawn.</desc>
